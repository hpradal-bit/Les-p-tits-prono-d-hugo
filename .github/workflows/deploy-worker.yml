# ============================================================================
# Déploiement du planificateur de synchronisation
# ----------------------------------------------------------------------------
# Cloudflare ne se déploie pas depuis cette session : son connecteur n'expose
# que la lecture pour les Workers, et le réseau y bloque son API. GitHub, lui,
# atteint les deux — d'où ce passage par ici.
#
# Trois secrets à régler une seule fois dans le dépôt
# (Settings → Secrets and variables → Actions) :
#
#   CLOUDFLARE_API_TOKEN  jeton « Edit Cloudflare Workers »
#   SYNC_SECRET           le même que la variable du même nom chez Vercel
#
# Ensuite, toute modification de `worker/` redéploie le planificateur seule.
# Le déclenchement manuel (`workflow_dispatch`) permet aussi de le relancer
# sans rien pousser — utile pour vérifier qu'il tourne encore.
# ============================================================================

name: Déployer le planificateur

on:
  push:
    branches: [claude/ptits-pronos-hugo-u3nry4]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # « Authentication failed [code: 9106] » ne dit pas *laquelle* des trois
      # causes est en jeu : secret absent, jeton tronqué, ou droits
      # insuffisants. On demande donc son avis à Cloudflare avant de déployer.
      # La longueur est sûre à afficher — la valeur, elle, reste masquée par
      # GitHub.
      - name: Vérifier le jeton
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Le secret CLOUDFLARE_API_TOKEN est vide ou absent du dépôt."
            exit 1
          fi
          echo "Longueur du jeton : ${#TOKEN} caractères (un jeton Cloudflare en fait 40)."
          code=$(curl -s -o /tmp/verify.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)
          echo "Cloudflare répond : HTTP $code"
          cat /tmp/verify.json; echo
          if [ "$code" != "200" ]; then
            echo "::error::Cloudflare refuse ce jeton. Il faut en créer un nouveau."
            exit 1
          fi
          echo "Le jeton est valide. Si le déploiement échoue malgré tout, ce sont les droits."

      # Deux étapes, et l'ordre compte : un secret ne peut pas être posé sur
      # un Worker qui n'existe pas encore. Les réunir faisait échouer le tout
      # premier déploiement, celui qui crée le Worker.
      - name: Déployer le Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          command: deploy

      - name: Poser le secret partagé
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          # Il ne peut pas vivre dans `wrangler.toml`, qui est versionné.
          secrets: |
            SYNC_SECRET
        env:
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
